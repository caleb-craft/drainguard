
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DrainGuard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef8f1;
      color: #1f2a25;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 18px 7%;
      border-bottom: 1px solid #d3e2d8;
    }

    .logo {
      color: #17653a;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .logo span {
      color: #2f9e5c;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 38px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(15, 74, 42, 0.1);
    }

    h1 {
      color: #0f4a2a;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .intro {
      color: #5b7065;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d3e2d8;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2f9e5c;
      border-color: transparent;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .password-row label {
      margin: 0;
    }

    .password-row button {
      border: none;
      background: none;
      color: #17653a;
      cursor: pointer;
      font-weight: bold;
    }

    .password-row + input {
      margin-bottom: 12px;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #17653a;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #17653a;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #0f4a2a;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #a33;
      line-height: 1.5;
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      color: #5b7065;
      font-size: 14px;
    }

    .signup a,
    .back-home {
      color: #17653a;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #5b7065;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="index.html">Drain<span>Guard</span></a>
  </header>

  <main>
    <section class="login-box">
      <h1 id="signInTitle">Welcome back</h1>
      <p class="intro" id="signInIntro">
        Sign in to access your DrainGuard dashboard.
      </p>

      <form id="loginForm">
        <label for="email" id="emailLabel">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

        <div class="password-row">
          <label for="password" id="passwordLabel">Password</label>
          <button type="button" id="togglePassword">Show</button>
        </div>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <label for="confirmPassword" id="confirmPasswordLabel" hidden>Confirm new password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter your new password again"
          autocomplete="new-password"
          minlength="8"
          hidden
        >

        <a class="forgot" href="#" id="forgotPassword">
          Forgot password?
        </a>

        <button class="submit-btn" id="submitButton" type="submit">Sign In</button>
        <p class="message" id="message" role="status"></p>
      </form>

      <p class="signup">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a class="back-home" href="index.html">← Back to homepage</a>
    </section>
  </main>

  <footer>
    © <span id="year"></span> DrainGuard System
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");

    toggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggle.textContent = showing ? "Show" : "Hide";
    });

    const message = document.getElementById("message");
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const passwordLabel = document.getElementById("passwordLabel");
    const confirmPassword = document.getElementById("confirmPassword");
    const confirmPasswordLabel = document.getElementById("confirmPasswordLabel");
    const submitButton = document.getElementById("submitButton");
    const recoveryMode = new URLSearchParams(window.location.search).get("recovery") === "1";

    if (recoveryMode) {
      document.getElementById("signInTitle").textContent = "Choose a new password";
      document.getElementById("signInIntro").textContent = "Enter and confirm your new password.";
      document.getElementById("emailLabel").hidden = true;
      email.hidden = true;
      email.required = false;
      document.getElementById("forgotPassword").hidden = true;
      passwordLabel.textContent = "New password";
      password.autocomplete = "new-password";
      confirmPasswordLabel.hidden = false;
      confirmPassword.hidden = false;
      confirmPassword.required = true;
      submitButton.textContent = "Update Password";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.style.color = "#a33";
      submitButton.disabled = true;

      try {
        if (recoveryMode) {
          if (password.value !== confirmPassword.value) {
            message.textContent = "Your passwords do not match.";
            return;
          }

          const { error } = await supabaseClient.auth.updateUser({ password: password.value });
          if (error) throw error;
          message.style.color = "#17653a";
          message.textContent = "Password updated. Redirecting to your dashboard...";
          window.location.replace("dashboard.html");
          return;
        }

        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });
        if (error) throw error;
        window.location.replace("dashboard.html");
      } catch (error) {
        message.textContent = error.message || "Something went wrong. Please try again.";
      } finally {
        submitButton.disabled = false;
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", async function (event) {
      event.preventDefault();
      if (!email.value.trim() || !email.checkValidity()) {
        message.textContent = "Enter a valid email address first.";
        email.focus();
        return;
      }

      message.style.color = "#a33";
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.value.trim(), {
          redirectTo: `${window.location.origin}/signin.html?recovery=1`
        });
        if (error) throw error;
        message.style.color = "#17653a";
        message.textContent = "If an account exists for that email, a password reset link is on its way.";
      } catch (error) {
        message.textContent = error.message || "Could not send the reset email. Please try again.";
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</body>
</html>
