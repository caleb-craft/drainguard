
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DrainGuard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef8f1;
      color: #1f2a25;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 18px 7%;
      border-bottom: 1px solid #d3e2d8;
    }

    .logo {
      color: #17653a;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .logo span {
      color: #2f9e5c;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 38px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(15, 74, 42, 0.1);
    }

    h1 {
      color: #0f4a2a;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .intro {
      color: #5b7065;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d3e2d8;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2f9e5c;
      border-color: transparent;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .password-row label {
      margin: 0;
    }

    .password-row button {
      border: none;
      background: none;
      color: #17653a;
      cursor: pointer;
      font-weight: bold;
    }

    .password-row + input {
      margin-bottom: 12px;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #17653a;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #17653a;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #0f4a2a;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #a33;
      line-height: 1.5;
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      color: #5b7065;
      font-size: 14px;
    }

    .signup a,
    .back-home {
      color: #17653a;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 22px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #5b7065;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="index.html">Drain<span>Guard</span></a>
  </header>

  <main>
    <section class="login-box">
      <h1>Welcome back</h1>
      <p class="intro">
        Sign in to access your DrainGuard dashboard.
      </p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

        <div class="password-row">
          <label for="password">Password</label>
          <button type="button" id="togglePassword">Show</button>
        </div>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <a class="forgot" href="#" id="forgotPassword">
          Forgot password?
        </a>

        <button class="submit-btn" type="submit">Sign In</button>
        <p class="message" id="message" role="status"></p>
      </form>

      <p class="signup">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a class="back-home" href="index.html">← Back to homepage</a>
    </section>
  </main>

  <footer>
    © <span id="year"></span> DrainGuard System
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");

    toggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggle.textContent = showing ? "Show" : "Hide";
    });

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "The sign-in page is ready, but account login needs to be connected to a secure backend.";
    });

    document.getElementById("forgotPassword").addEventListener("click", function (event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Password recovery will be available after account authentication is connected.";
    });
  </script>
</body>
</html>
