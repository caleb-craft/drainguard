
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | DrainGuard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef8f1;
      color: #1f2a25;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 18px 7%;
      border-bottom: 1px solid #d3e2d8;
    }

    .logo {
      color: #17653a;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .logo span {
      color: #2f9e5c;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .signup-box {
      background: white;
      width: 100%;
      max-width: 460px;
      padding: 36px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(15, 74, 42, 0.1);
    }

    h1 {
      color: #0f4a2a;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .intro {
      color: #5b7065;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d3e2d8;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2f9e5c;
      border-color: transparent;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #17653a;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:hover {
      background: #0f4a2a;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .signin {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #5b7065;
    }

    .signin a,
    .back-home {
      color: #17653a;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #5b7065;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .signup-box {
        padding: 26px 21px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="index.html">Drain<span>Guard</span></a>
  </header>

  <main>
    <section class="signup-box">
      <h1>Create your account</h1>
      <p class="intro">
        Join DrainGuard and track your recycling activity.
      </p>

      <form id="signupForm">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter your password again"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button class="submit-btn" type="submit">
          Create Account
        </button>

        <p class="message" id="message" role="status"></p>
      </form>

      <p class="signin">
        Already have an account?
        <a href="signin.html">Sign in</a>
      </p>

      <a class="back-home" href="index.html">← Back to homepage</a>
    </section>
  </main>

  <footer>
    © <span id="year"></span> DrainGuard System
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("signupForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.style.color = "#b42318";
        message.textContent = "Your passwords do not match.";
        return;
      }

      message.style.color = "#17653a";
      message.textContent =
        "The form is ready. Account creation needs a secure backend before it can save your account.";
    });
  </script>
</body>
</html>
